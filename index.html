<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPT Audit Checklist & Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar: Projects Management -->
    <!-- Sidebar: Projects Management -->
    <aside class="sidebar" id="sidebar">
        <!-- Collapse Toggle Arrow Button -->
        <button id="sidebarToggleBtn" class="sidebar-toggle" title="Toggle Sidebar">◀</button>

        <div class="sidebar-content">
            <h2>Projects</h2>

            <!-- New Project Input -->
            <div class="project-form">
                <input type="text" id="newProjectInput" placeholder="New project name...">
                <button id="addProjectBtn">+ Add</button>
            </div>

            <!-- Dynamic Projects List -->
            <ul id="projectList" class="project-list">
                <!-- Populated via JavaScript -->
            </ul>

            <!-- Master Template Box -->
            <div class="template-box">
                <h3 style="color: #38bdf8; font-size: 0.95rem; margin-bottom: 8px;">+ Master Template</h3>
                <select id="tplScope" style="margin-bottom: 6px;">
                    <option value="Web">Web</option>
                    <option value="API">API</option>
                    <option value="Server">Server</option>
                </select>
                <input type="text" id="tplName" placeholder="Test Name (e.g. SSRF)" style="margin-bottom: 6px;">
                <input type="text" id="tplTool" placeholder="Tools (e.g. Burp Suite)" style="margin-bottom: 6px;">
                <textarea id="tplDesc" placeholder="Brief description..."
                    style="margin-bottom: 6px; height: 50px;"></textarea>
                <button id="addTemplateBtn"
                    style="width: 100%; background: #0284c7; color: white; padding: 6px; border: none; border-radius: 4px; cursor: pointer;">Add
                    to Master</button>
            </div>
        </div>
    </aside>
    
    <!-- Main Work Area -->
    <main class="main-content">
        <header class="topbar">
            <h1 id="currentProjectTitle">Select a Project</h1>
            <div style="display: flex; gap: 10px;">
                <!-- New Sync Button -->
                <button id="syncProjectBtn" class="btn-sync" style="display: none;">🔄 Sync New Checks</button>
                <button id="deleteProjectBtn" class="btn-danger" style="display: none;">Delete Project</button>
            </div>
        </header>

        <!-- Subproject Navigation Tabs -->
        <nav class="scope-tabs" id="scopeTabs" style="display: none;">
            <button class="tab-btn active" data-scope="Web">Web</button>
            <button class="tab-btn" data-scope="API">API</button>
            <button class="tab-btn" data-scope="Server">Server</button>
        </nav>

        <!-- Checklist Table Container -->
        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th style="width: 180px;">Test Name</th>
                        <th style="width: 250px;">Description</th>
                        <th style="width: 140px;">Tool</th>
                        <th style="width: 200px;">Vulnerable URL</th>
                        <th style="width: 130px;">Progress</th>
                        <th style="width: 110px;">Status</th>
                        <th>Methodology / Notes</th>
                        <th style="width: 80px;">Action</th>
                    </tr>
                </thead>
                <tbody id="checklistBody">
                    <tr>
                        <td colspan="9" class="empty-state">Select or create a project to start auditing.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
